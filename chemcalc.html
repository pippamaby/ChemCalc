<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChemCalc — AI Chemical Engineering Calculator</title>
</head>

<body>

    <h1>ChemCalc</h1>

    <p>Ask an AI agent to perform a chemical engineering calculation.</p>

    <input
        type="text"
        id="question"
        placeholder="e.g. Calculate the Reynolds number..."
    >

    <button onclick="askChemCalc()">Calculate</button>

    <p id="answer"></p>

    <script>
        async function askChemCalc() {
            const question = document.getElementById("question").value;
            const answer = document.getElementById("answer");

            answer.textContent = "Calculating...";

            const response = await fetch("http://127.0.0.1:5000/ask", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ question: question })
            });

            const data = await response.json();

            answer.textContent = data.answer;
        }
    </script>

</body>
</html>
